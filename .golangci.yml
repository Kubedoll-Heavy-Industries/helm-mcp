version: "2"

run:
  timeout: 10m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        # SA1019 flags mcp.LoggingLevel / session.Log, deprecated by SEP-2577.
        # The API remains functional during the deprecation window and is still
        # used for best-effort client notifications; drop this exclusion when
        # the codebase migrates off MCP logging.
        - -SA1019

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubedoll-heavy-industries/helm-mcp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
